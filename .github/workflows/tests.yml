name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chesslab_test
          POSTGRES_PASSWORD: chesslab_test
          POSTGRES_DB: chesslab_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U chesslab_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CHESSLAB_TEST_POSTGRES_URL: postgresql://chesslab_test:chesslab_test@localhost:5432/chesslab_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
